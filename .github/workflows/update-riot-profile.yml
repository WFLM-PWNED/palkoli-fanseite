name: Auto-Update Riot Profile Stats

on:
  schedule:
    - cron: '*/30 * * * *'  # Alle 30 Minuten
  workflow_dispatch:  # Manuell triggern

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch Riot Stats and Update profile.json
        run: |
          python3 << 'EOF'
          import json
          import time
          import urllib.parse
          import requests
          from datetime import datetime, timezone

          # ---- Konfiguration ----
          RIOT_API_KEY = "${{ secrets.RIOT_API_KEY }}"
          GAME_NAME = "WFLM PWNED"
          TAG_LINE = "EUW"
          PLATFORM = "euw1"      # Plattform-Routing (Rang, Liga)
          REGION = "europe"      # Regions-Routing (Account, Matches)
          RANKED_QUEUE_ID = 420  # 420 = Ranked Solo/Duo
          MATCH_COUNT = 5

          HEADERS = {"X-Riot-Token": RIOT_API_KEY}
          RANK_TO_NUMBER = {"I": "1", "II": "2", "III": "3", "IV": "4"}

          def riot_get(url, params=None):
              res = requests.get(url, headers=HEADERS, params=params, timeout=15)
              if res.status_code == 429:
                  retry_after = int(res.headers.get("Retry-After", 5))
                  print(f"⏳ Rate limit erreicht, warte {retry_after}s...")
                  time.sleep(retry_after)
                  res = requests.get(url, headers=HEADERS, params=params, timeout=15)
              res.raise_for_status()
              return res.json()

          # Schritt 1: Riot ID -> PUUID
          encoded_name = urllib.parse.quote(GAME_NAME)
          encoded_tag = urllib.parse.quote(TAG_LINE)
          account_url = f"https://{REGION}.api.riotgames.com/riot/account/v1/accounts/by-riot-id/{encoded_name}/{encoded_tag}"

          try:
              account_data = riot_get(account_url)
          except requests.exceptions.HTTPError as e:
              print(f"❌ Konnte Riot-Account nicht finden: {e}")
              exit(1)

          puuid = account_data["puuid"]
          print(f"✅ PUUID gefunden fuer {GAME_NAME}#{TAG_LINE}")

          # Schritt 2: Rang-Infos abrufen
          league_url = f"https://{PLATFORM}.api.riotgames.com/lol/league/v4/entries/by-puuid/{puuid}"
          league_entries = riot_get(league_url)

          solo_queue = next(
              (e for e in league_entries if e.get("queueType") == "RANKED_SOLO_5x5"),
              None
          )

          if solo_queue:
              profile = {
                  "tier": solo_queue["tier"].capitalize(),
                  "rank": RANK_TO_NUMBER.get(solo_queue["rank"], solo_queue["rank"]),
                  "leaguePoints": solo_queue["leaguePoints"],
                  "wins": solo_queue["wins"],
                  "losses": solo_queue["losses"],
              }
          else:
              print("ℹ️  Kein Ranked Solo/Duo Eintrag gefunden (unranked).")
              profile = {
                  "tier": "Unranked",
                  "rank": "",
                  "leaguePoints": 0,
                  "wins": 0,
                  "losses": 0,
              }

          # Schritt 3: Letzte Matches fuer die "Form"-Anzeige
          matches_url = f"https://{REGION}.api.riotgames.com/lol/match/v5/matches/by-puuid/{puuid}/ids"
          match_ids = riot_get(matches_url, params={
              "queue": RANKED_QUEUE_ID,
              "start": 0,
              "count": MATCH_COUNT
          })

          # Falls keine Ranked-Matches gefunden wurden, auf alle Spielmodi ausweichen
          if not match_ids:
              print("ℹ️  Keine Ranked-Matches gefunden, nutze allgemeine Match-History.")
              match_ids = riot_get(matches_url, params={"start": 0, "count": MATCH_COUNT})

          recent_form = []
          for match_id in match_ids:
              time.sleep(1.2)  # kleine Pause zwischen Requests
              match_url = f"https://{REGION}.api.riotgames.com/lol/match/v5/matches/{match_id}"
              try:
                  match_data = riot_get(match_url)
              except requests.exceptions.HTTPError as e:
                  print(f"⚠️  Match {match_id} konnte nicht geladen werden: {e}")
                  continue

              participant = next(
                  (p for p in match_data["info"]["participants"] if p["puuid"] == puuid),
                  None
              )
              if participant:
                  recent_form.append("W" if participant["win"] else "L")

          # Aelteste zuerst, neuestes Spiel zuletzt anzeigen
          recent_form.reverse()
          profile["recentForm"] = recent_form

          # Schritt 4: Data Dragon -> Champion-Namen & Bilder (kein API-Key noetig,
          # oeffentliches CDN von Riot)
          ddragon_versions = requests.get(
              "https://ddragon.leagueoflegends.com/api/versions.json", timeout=15
          ).json()
          ddragon_version = ddragon_versions[0]
          champion_data = requests.get(
              f"https://ddragon.leagueoflegends.com/cdn/{ddragon_version}/data/en_US/champion.json",
              timeout=15
          ).json()["data"]

          # championId (Zahl) -> {Anzeigename, Dateiname fuer Bild-URL}
          champion_by_id = {
              int(info["key"]): {"name": info["name"], "id": champ_id}
              for champ_id, info in champion_data.items()
          }

          # Schritt 5: Top 3 Champion Mastery
          top_champions = []
          try:
              mastery_url = (
                  f"https://{PLATFORM}.api.riotgames.com/lol/champion-mastery/v4/"
                  f"champion-masteries/by-puuid/{puuid}/top"
              )
              top_masteries = riot_get(mastery_url, params={"count": 3})
              for m in top_masteries:
                  champ_info = champion_by_id.get(m["championId"])
                  if not champ_info:
                      continue
                  top_champions.append({
                      "name": champ_info["name"],
                      "image": f"https://ddragon.leagueoflegends.com/cdn/{ddragon_version}/img/champion/{champ_info['id']}.png",
                      "level": m["championLevel"],
                      "points": m["championPoints"],
                  })
          except requests.exceptions.HTTPError as e:
              print(f"⚠️  Champion Mastery konnte nicht geladen werden: {e}")

          profile["topChampions"] = top_champions

          # Schritt 6: Aktuell im Spiel? (Spectator-V5)
          # Hinweis: Falls dieser Endpoint fuer den API-Key (noch) nicht freigegeben
          # ist, faengt der try/except das ab - "liveGame" bleibt dann einfach false,
          # der Rest des Workflows laeuft trotzdem normal weiter.
          live_game = {"inGame": False}
          try:
              spectator_url = (
                  f"https://{PLATFORM}.api.riotgames.com/lol/spectator/v5/"
                  f"active-games/by-summoner/{puuid}"
              )
              res = requests.get(spectator_url, headers=HEADERS, timeout=15)
              if res.status_code == 200:
                  game_data = res.json()
                  my_participant = next(
                      (p for p in game_data.get("participants", []) if p.get("puuid") == puuid),
                      None
                  )
                  champ_info = (
                      champion_by_id.get(my_participant["championId"])
                      if my_participant else None
                  )
                  live_game = {
                      "inGame": True,
                      "gameMode": game_data.get("gameMode", ""),
                      "gameLengthMinutes": max(0, game_data.get("gameLength", 0) // 60),
                      "championName": champ_info["name"] if champ_info else None,
                  }
              elif res.status_code != 404:
                  print(f"⚠️  Spectator-Abfrage: unerwarteter Status {res.status_code}")
          except requests.exceptions.RequestException as e:
              print(f"⚠️  Spectator-Abfrage fehlgeschlagen: {e}")

          profile["liveGame"] = live_game

          # Schritt 7: Season Challenges (lol-challenges-v1) - Gesamt-Level +
          # die 3 beeindruckendsten einzelnen Challenge-Erfolge der Season.
          # Komplett optional/defensiv: falls der Endpoint fuer den Key nicht
          # freigegeben ist, bleibt "challenges" einfach None und die Website
          # blendet den Bereich aus.
          LEVEL_RANK = {
              "NONE": 0, "IRON": 1, "BRONZE": 2, "SILVER": 3, "GOLD": 4,
              "PLATINUM": 5, "EMERALD": 6, "DIAMOND": 7, "MASTER": 8,
              "GRANDMASTER": 9, "CHALLENGER": 10,
          }

          challenges_summary = None
          try:
              config_url = f"https://{PLATFORM}.api.riotgames.com/lol/challenges/v1/challenges/config"
              challenge_config = riot_get(config_url)
              challenge_names = {
                  c["id"]: c.get("localizedNames", {}).get("en_US", {}).get("name", f"Challenge #{c['id']}")
                  for c in challenge_config
              }

              player_data_url = f"https://{PLATFORM}.api.riotgames.com/lol/challenges/v1/player-data/{puuid}"
              player_challenges = riot_get(player_data_url)

              total_points = player_challenges.get("totalPoints", {})
              total_level = total_points.get("level", "NONE").capitalize()
              total_percentile = total_points.get("percentile")
              percentile_text = (
                  f"Top {round(total_percentile * 100)}%" if total_percentile is not None else None
              )

              # Nur echte Erfolge (Level > NONE, Wert > 0), sortiert nach
              # hoechstem Level und (bei Gleichstand) bestem Perzentil
              achieved = [
                  c for c in player_challenges.get("challenges", [])
                  if c.get("level") and c["level"] != "NONE" and c.get("value", 0) > 0
              ]
              achieved.sort(
                  key=lambda c: (
                      LEVEL_RANK.get(c.get("level", "NONE"), 0),
                      -(c.get("percentile", 1) or 1),
                  ),
                  reverse=True
              )

              highlights = [
                  {
                      "name": challenge_names.get(c["challengeId"], f"Challenge #{c['challengeId']}"),
                      "level": c["level"].capitalize(),
                      "value": c.get("value"),
                  }
                  for c in achieved[:3]
              ]

              challenges_summary = {
                  "totalLevel": total_level,
                  "totalPoints": total_points.get("current", 0),
                  "percentile": percentile_text,
                  "highlights": highlights,
              }
          except requests.exceptions.HTTPError as e:
              print(f"⚠️  Season Challenges konnten nicht geladen werden: {e}")
          except Exception as e:
              print(f"⚠️  Unerwarteter Fehler bei Season Challenges: {e}")

          profile["challenges"] = challenges_summary
          profile["lastUpdate"] = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          with open("profile.json", "w") as f:
              json.dump(profile, f, indent=2, ensure_ascii=False)

          print(f"✅ Profil aktualisiert: {profile['tier']} {profile['rank']} · {profile['leaguePoints']} LP")
          print(f"   Siege: {profile['wins']} | Niederlagen: {profile['losses']} | Form: {recent_form}")
          print(f"   Top Champions: {[c['name'] for c in top_champions]}")
          print(f"   Live-Match: {live_game['inGame']}")
          if challenges_summary:
              print(f"   Challenges: {challenges_summary['totalLevel']} · {[h['name'] for h in challenges_summary['highlights']]}")

          # Schritt 8: Rang-Verlauf fortschreiben (nur bei tatsaechlicher Aenderung,
          # damit der Verlauf nicht mit identischen Punkten vollgeschrieben wird)
          MAX_HISTORY_ENTRIES = 200

          try:
              with open("rank-history.json", "r") as f:
                  history_data = json.load(f)
          except (OSError, json.JSONDecodeError):
              history_data = {"history": []}

          history = history_data.get("history", [])
          last_entry = history[-1] if history else None

          should_log = (
              last_entry is None
              or last_entry.get("leaguePoints") != profile["leaguePoints"]
              or last_entry.get("wins") != profile["wins"]
              or last_entry.get("losses") != profile["losses"]
              or last_entry.get("tier") != profile["tier"]
              or last_entry.get("rank") != profile["rank"]
          )

          if should_log:
              history.append({
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "tier": profile["tier"],
                  "rank": profile["rank"],
                  "leaguePoints": profile["leaguePoints"],
                  "wins": profile["wins"],
                  "losses": profile["losses"],
              })
              history = history[-MAX_HISTORY_ENTRIES:]
              print(f"📈 Neuer Rang-Verlauf-Eintrag geloggt (insgesamt {len(history)}).")
          else:
              print("📈 Keine Aenderung seit letztem Eintrag, Rang-Verlauf bleibt gleich.")

          with open("rank-history.json", "w") as f:
              json.dump({"history": history}, f, indent=2, ensure_ascii=False)

          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add profile.json rank-history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🛡️ Auto-update: Riot Profil-Stats aktualisiert" && git pull --rebase origin main && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
